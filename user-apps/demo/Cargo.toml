# Test and demo programs for the ring 3 process support (built by kernel/build.rs, embedded in the
# kernel, started with the `run` shell command). Each file in src/bin is one program.
[package]
name = "demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kitsune-user = { path = "../sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace]
