# Kitsune user SDK: what a ring 3 program links against. System calls over `int 0x80`, `print!`,
# the panic handler and the `entry!` macro. `no_std`, one dependency (the shared ABI); see docs/design/processos.md.
[package]
name = "kitsune-user"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Numbers, flags, error codes and records shared with the kernel.
kitsune-userabi = { path = "../abi", default-features = false }

[lib]
crate-type = ["rlib"]

# Detached from the repository workspace (own lock, built only for x86_64-unknown-none).
[workspace]
