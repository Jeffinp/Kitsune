[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
license-file = "../LICENSE"
publish = false

[dependencies]
bootloader_api = "0.11"
kitsune_core = { path = "../kitsune_core" }
# What ring 3 programs and the kernel agree on for files and arguments (also linked by the SDK).
kitsune-userabi = { path = "../user-apps/abi" }
x86_64 = "0.15"
# no_std TCP/IP stack layered over our NE2000 driver (the browser's networking).
smoltcp = { version = "0.14", default-features = false, features = [
    "alloc",
    "medium-ethernet",
    "proto-ipv4",
    "proto-dhcpv4",
    "socket-tcp",
    "socket-dhcpv4",
    "socket-udp",
] }
# TLS 1.3 for HTTPS. no_std, no alloc — uses heapless. The server certificate is
# verified by our own `CryptoProvider` (src/tlsv.rs -> kitsune_core::tlsverify);
# `UnsecureProvider` (no verification) is not used.
embedded-tls = { version = "0.19", default-features = false }
embedded-io = "0.7"
rand_core = { version = "0.6.3", default-features = false }
# The `x86_64-unknown-none` target compiles with SSE disabled, so the crypto
# crates' SIMD backends fail to codegen ("Do not know how to split the result of
# this operator"). sha2 exposes a `force-soft` cargo feature; aes/polyval/ghash
# are forced to their software backends via `--cfg` flags in `.cargo/config.toml`.
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
# WebAssembly interpreter — the OS's native app format. no_std, alloc-based.
wasmi = { version = "2", default-features = false, features = ["validate"] }

# Host-only: assembles the demo WAT into binary .wasm at build time (see build.rs).
[build-dependencies]
wat = "1"

[features]
# Per-second runtime statistics on COM1 (frame paths, allocator, timer ISR, idle
# sampling, input latency). Off by default: every hook folds away. See trace.rs.
perf-trace = []

# The kernel binary is bare-metal: never built or run as a host test target.
[[bin]]
name = "kernel"
test = false
bench = false
