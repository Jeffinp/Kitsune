<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Preact TodoMVC</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;color:#333;margin:0}
.todoapp{background:#fff;max-width:560px;margin:16px auto;border:1px solid #ddd;border-radius:8px;padding:0 0 8px}
.todoapp h1{margin:0;padding:10px 16px;color:#b83f45;font-size:32px}
.new-todo{margin:0 16px 8px;font-size:16px}
.todo-list{list-style:none;margin:0;padding:0 16px}
.todo-list li{padding:4px 0;border-bottom:1px solid #eee}
.todo-list li.completed label{text-decoration:line-through;color:#999}
.destroy{margin-left:12px}
.footer{padding:6px 16px;color:#777}
.filters{list-style:none;margin:4px 0;padding:0;display:flex;gap:12px}
.filters a{color:#777;padding:2px 6px}
.filters a.selected{border:1px solid #b83f45;border-radius:4px;color:#b83f45}
.info{margin:8px 16px;font-size:13px;color:#555}
</style>
</head>
<body>
<div id="app"></div>
<script src="/assets/preact.umd.js"></script>
<script src="/assets/hooks.umd.js"></script>
<script src="/assets/htm.umd.js"></script>
<script src="/assets/todo-preact.js"></script>
</body>
</html>
