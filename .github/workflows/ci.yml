name: ci

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly nightly canary

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the nightly pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p kitsune_core
      - run: cargo test -p kitsune-userabi
      # Proves the core really is no_std / bare-metal clean.
      - run: cargo build -p kitsune_core --target x86_64-unknown-none

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p kitsune_core --all-targets -- -D warnings
      - run: cargo clippy -p kernel --target x86_64-unknown-none -- -D warnings
      - run: cargo fmt --all -- --check

  build-image:
    runs-on: ubuntu-latest
    needs: [test-core, lint]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p os --release # kernel + bootloader + BIOS/UEFI images
      - uses: actions/upload-artifact@v4
        with:
          name: kitsune-images
          path: target/release/build/os-*/out/*.img
          if-no-files-found: warn

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov -p kitsune_core --branch --fail-under-lines 90 --summary-only

  # Replays every minimised crash input (fuzz/regressions) through the fuzz targets
  # with overflow checks on. A fixed bug that comes back fails here.
  fuzz-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@cargo-fuzz
      - run: |
          cd fuzz
          for t in net_parse ojfs_parse web_parse; do
            cargo fuzz run "$t" regressions/"$t"/*
          done

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Non-blocking: catches the next toolchain break (like Step::forward_overflowing
  # in July 2026) before it lands on a pinned build.
  nightly-canary:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal -c rust-src,llvm-tools,clippy -t x86_64-unknown-none
      - run: rustup override set nightly
      - run: cargo build -p os --release
