[workspace]
resolver = "2"
members = ["kernel", "os", "kitsune_core", "user-apps/abi"]

# NOTE: panic strategy is NOT forced here. The bare-metal target
# `x86_64-unknown-none` aborts by default, while host `cargo test` for
# `kitsune_core` needs the default unwinding harness. Keeping the profile
# untouched lets both work.

# `cargo test -p kitsune_core` runs power-cut sweeps (every sector of many
# operation sequences) and 6000-step property tests over OJFS v3: optimize the
# core under test (overflow checks and debug assertions stay on).
[profile.test.package.kitsune_core]
opt-level = 2

# Release builds the bootable image: optimize hard. LTO + a single codegen
# unit let the per-pixel/per-frame hot paths inline and vectorize.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# The kernel is consumed as an *artifact build-dependency*. Pin the kernel (and
# the bootloader/build glue) to opt-level 3 explicitly, so the bootable image can
# never accidentally embed an unoptimized kernel regardless of Cargo's default
# `build-override` behaviour.
[profile.release.build-override]
opt-level = 3
codegen-units = 1
